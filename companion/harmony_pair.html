<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手机配对 | 陪护控制台</title><link rel="stylesheet" href="/mobile.css"><script src="/mobile.js" defer></script></head>
<body><main><header><h1>手机配对</h1><a href="/">打开电脑控制台</a></header><p id="mode">正在读取网关</p><section><dl><dt>电脑 IP</dt><dd id="host">--</dd><dt>8 位配对码</dt><dd id="code">--------</dd></dl><p id="status" role="status">正在读取</p></section><section aria-labelledby="controller-title"><h2 id="controller-title">主控日志</h2><p id="controller-state" role="status">正在读取</p><button id="release-controller" type="button" disabled>释放主控串口</button><p id="controller-result" role="status"></p></section><p>手机打开“陪护控制台”中的“状态与连接”，填写以上 IP 和配对码。</p><p class="muted">配对码只在本机显示，不要分享。有效期 5 分钟；关闭网关会断开手机。</p></main></body></html>
